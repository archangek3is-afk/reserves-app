<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Scanner html5-qrcode — Test</title>
  <style>
    *, *::before, *::after { box-sizing:border-box; margin:0; padding:0; }
    :root {
      --safe-top:env(safe-area-inset-top,0px);
      --safe-bottom:env(safe-area-inset-bottom,0px);
      --bg:#0f172a; --surface:#1e293b; --border:#334155;
      --text:#f1f5f9; --dim:#94a3b8; --accent:#2563eb;
      --mono:'Courier New',monospace;
    }
    html,body { height:100%; background:var(--bg); color:var(--text);
      font-family:system-ui,-apple-system,sans-serif; -webkit-text-size-adjust:100%; }
    body { display:flex; flex-direction:column;
      padding-top:var(--safe-top); padding-bottom:var(--safe-bottom); overflow-x:hidden; }

    .hdr { padding:10px 16px 6px; background:var(--surface);
      border-bottom:1px solid var(--border); flex-shrink:0; }
    .hdr h1 { font-size:.95rem; font-weight:700; }
    .hdr p  { font-size:.68rem; color:var(--dim); margin-top:2px; }

    /* Zone de départ */
    #start-section { flex-shrink:0; padding:16px; }
    #btn-start { width:100%; height:56px; background:var(--accent); color:#fff;
      border:none; border-radius:12px; font-size:1.05rem; font-weight:700;
      cursor:pointer; -webkit-tap-highlight-color:transparent; }

    /* Viewfinder — hauteur réservée AVANT que la vidéo charge */
    #reader-wrap { position:relative; width:100%;
      min-height:240px; background:#000; flex-shrink:0; display:none; }
    /* html5-qrcode injecte video + canvas ici */
    #reader { width:100%; min-height:240px; }
    #reader video { width:100% !important; height:auto !important; display:block; }
    #reader img { display:none !important; }

    /* Torch */
    #btn-torch { position:absolute; top:10px; right:10px; z-index:10;
      width:44px; height:44px; border:none; border-radius:22px;
      background:rgba(0,0,0,.55); color:#fff; font-size:1.3rem; cursor:pointer;
      display:none; align-items:center; justify-content:center;
      -webkit-tap-highlight-color:transparent; }
    #btn-torch.visible { display:flex; }
    #btn-torch.on { background:rgba(255,220,0,.75); color:#000; }

    /* Bouton scan suivant */
    #btn-next-wrap { flex-shrink:0; padding:10px 16px; display:none; }
    #btn-next-wrap.visible { display:block; }
    #btn-next { width:100%; height:52px; background:var(--accent); color:#fff;
      border:none; border-radius:12px; font-size:1rem; font-weight:700;
      cursor:pointer; -webkit-tap-highlight-color:transparent; }

    /* Status + debug */
    #status { flex-shrink:0; padding:5px 16px; font-size:.78rem; color:#fbbf24; min-height:26px; }
    #debug  { flex-shrink:0; padding:3px 16px; font-size:.67rem; color:var(--dim);
      font-family:var(--mono); white-space:pre-wrap; word-break:break-all; }
    #errors { flex-shrink:0; padding:3px 16px; font-size:.67rem; color:#f87171;
      font-family:var(--mono); white-space:pre-wrap; word-break:break-all; min-height:0; }

    /* Dernier scan */
    #last-result { flex-shrink:0; padding:10px 16px;
      background:var(--surface); border-bottom:1px solid var(--border); min-height:58px; }
    #last-result .lbl { font-size:.6rem; color:var(--dim);
      text-transform:uppercase; letter-spacing:.08em; margin-bottom:2px; }
    #last-result .ean { font-family:var(--mono); font-size:1.3rem; font-weight:700;
      color:#4ade80; letter-spacing:.04em; }
    #last-result.waiting .ean { color:var(--dim); font-size:.85rem; font-family:inherit; font-weight:400; }
    #last-result .meta { font-size:.7rem; color:var(--dim); margin-top:2px; }

    /* Historique */
    #hist-section { flex:1; overflow-y:auto; -webkit-overflow-scrolling:touch; }
    .hist-hdr { padding:8px 16px 4px; font-size:.6rem; color:var(--dim);
      text-transform:uppercase; letter-spacing:.08em;
      position:sticky; top:0; background:var(--bg); z-index:1; }
    #hist-list { list-style:none; padding:0 16px 8px; }
    #hist-list li { display:flex; align-items:baseline; gap:8px;
      padding:6px 0; border-bottom:1px solid var(--border); }
    #hist-list li:last-child { border-bottom:none; }
    .hi { font-size:.66rem; color:var(--dim); width:16px; flex-shrink:0; text-align:right; }
    .he { font-family:var(--mono); font-size:.9rem; font-weight:700; flex:1; }
    .hf { font-size:.64rem; color:var(--dim); flex-shrink:0; }
    .hm { font-size:.73rem; color:#facc15; flex-shrink:0; min-width:50px; text-align:right; }

    /* Saisie manuelle */
    #manual { flex-shrink:0; padding:8px 16px;
      background:var(--surface); border-top:1px solid var(--border); display:flex; gap:8px; }
    #m-input { flex:1; background:var(--bg); border:1px solid var(--border);
      border-radius:8px; color:var(--text); font-size:1rem;
      padding:0 10px; height:44px; font-family:var(--mono); -webkit-appearance:none; }
    #m-ok { height:44px; padding:0 14px; background:var(--accent); color:#fff;
      border:none; border-radius:8px; font-size:.85rem; font-weight:600;
      cursor:pointer; -webkit-tap-highlight-color:transparent; }
  </style>
</head>
<body>

  <div class="hdr">
    <h1>html5-qrcode 2.3.8 — Test</h1>
    <p>Tous formats (EAN-13/8, UPC-A…) &nbsp;|&nbsp; Caméra arrière</p>
  </div>

  <!-- Bouton de démarrage (user-gesture → getUserMedia) -->
  <div id="start-section">
    <button id="btn-start">📷 Lancer la caméra</button>
  </div>

  <!-- Viewfinder — caché jusqu'au lancement -->
  <div id="reader-wrap">
    <div id="reader"></div>
    <button id="btn-torch" aria-label="Lampe torche">🔦</button>
  </div>

  <div id="status">Appuyez sur "Lancer la caméra"</div>
  <div id="debug">résolution : —</div>
  <div id="errors"></div>

  <!-- Bouton "scan suivant" -->
  <div id="btn-next-wrap">
    <button id="btn-next">▶ Scanner le produit suivant</button>
  </div>

  <div id="last-result" class="waiting">
    <div class="lbl">Dernier scan</div>
    <div class="ean">En attente…</div>
    <div class="meta"></div>
  </div>

  <div id="hist-section">
    <div class="hist-hdr">Historique (10 derniers)</div>
    <ul id="hist-list">
      <li style="color:var(--dim);font-size:.78rem;padding:8px 0;border:none;">Aucun scan pour le moment.</li>
    </ul>
  </div>

  <div id="manual">
    <input id="m-input" type="text" inputmode="numeric" pattern="[0-9]*"
           placeholder="Code manuel" maxlength="14" enterkeyhint="done">
    <button id="m-ok">OK</button>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <script>
    'use strict';

    // ── Erreurs JS visibles à l'écran ──────────────────────────────────────────
    const errorsEl = document.getElementById('errors');
    window.onerror = (msg, src, line) => {
      errorsEl.textContent += '[JS] ' + msg + ' (' + (src||'').split('/').pop() + ':' + line + ')\n';
      return false;
    };
    window.addEventListener('unhandledrejection', e => {
      errorsEl.textContent += '[P] ' + (e.reason?.message || String(e.reason)) + '\n';
    });

    const statusEl = document.getElementById('status');
    const debugEl  = document.getElementById('debug');
    const lastEl   = document.getElementById('last-result');
    const histList = document.getElementById('hist-list');
    const btnTorch = document.getElementById('btn-torch');
    const btnNextW = document.getElementById('btn-next-wrap');
    const btnNext  = document.getElementById('btn-next');
    const mInput   = document.getElementById('m-input');
    const mOk      = document.getElementById('m-ok');

    let scans        = [];
    let timerStart   = null;
    let lastCode     = null;
    let lastCodeTime = 0;
    const DEBOUNCE   = 2000;
    let torchOn      = false;
    let torchFeature = null;
    let scanner      = null;

    function fmtMs(ms) { return ms < 1000 ? ms + ' ms' : (ms/1000).toFixed(2) + ' s'; }
    function fmtFmt(f) { return (f || '?').replace(/_/g, '-'); }

    function recordScan(ean, fmt) {
      const now = Date.now();
      const ms  = timerStart != null ? now - timerStart : 0;
      timerStart = null;

      scans.unshift({ ean, fmt: fmtFmt(fmt), ms });
      if (scans.length > 10) scans.length = 10;

      lastEl.classList.remove('waiting');
      lastEl.querySelector('.ean').textContent  = ean;
      lastEl.querySelector('.meta').textContent = fmtFmt(fmt) + '  ·  ' + fmtMs(ms) + ' depuis le tap';

      histList.innerHTML = scans.map((s, i) =>
        `<li><span class="hi">${i+1}</span><span class="he">${s.ean}</span>` +
        `<span class="hf">${s.fmt}</span><span class="hm">${fmtMs(s.ms)}</span></li>`
      ).join('');

      statusEl.textContent = '✓ ' + ean + ' — ' + fmtMs(ms);
      if ('vibrate' in navigator) navigator.vibrate(60);
      btnNextW.classList.add('visible');
    }

    function onScan(ean, result) {
      const now = Date.now();
      if (ean === lastCode && now - lastCodeTime < DEBOUNCE) return;
      lastCode = ean; lastCodeTime = now;
      recordScan(ean, result?.result?.format?.formatName ?? 'UNKNOWN');
    }

    btnNext.addEventListener('click', () => {
      timerStart = Date.now();
      btnNextW.classList.remove('visible');
      statusEl.textContent = '📷 Scan en cours…';
    });

    // ── Lancement caméra (user-gesture) ────────────────────────────────────────
    document.getElementById('btn-start').addEventListener('click', () => {
      // Cacher le bouton de départ, afficher le viewfinder
      document.getElementById('start-section').style.display = 'none';
      document.getElementById('reader-wrap').style.display   = 'block';
      statusEl.textContent = 'Ouverture de la caméra…';

      scanner = new Html5Qrcode('reader', { verbose: false });

      // Config minimale — pas d'aspectRatio, pas de formatsToSupport
      scanner.start(
        { facingMode: 'environment' },
        {
          fps: 10,
          qrbox: { width: 280, height: 110 },   // rectangle fixe, pas de fonction
        },
        onScan,
        (_err) => {}   // erreurs par frame = normales
      ).then(() => {
        timerStart = Date.now();
        statusEl.textContent = '📷 Caméra active — pointez vers un code-barres';

        // Résolution réelle
        try {
          const t = scanner.getRunningTrackSettings();
          debugEl.textContent = 'résolution : ' + t.width + '×' + t.height +
            '  |  facing : ' + (t.facingMode || '?');
        } catch(_) {}

        // Torch
        try {
          const caps = scanner.getRunningTrackCameraCapabilities();
          torchFeature = caps.torchFeature();
          if (torchFeature?.isSupported()) btnTorch.classList.add('visible');
        } catch(_) {}
      }).catch(err => {
        statusEl.textContent = '⚠️ Erreur caméra : ' + err;
        errorsEl.textContent += '[cam] ' + String(err) + '\n';
        // Ré-afficher le bouton de départ en cas d'erreur
        document.getElementById('start-section').style.display = 'block';
        document.getElementById('reader-wrap').style.display   = 'none';
      });
    });

    // ── Torch ──────────────────────────────────────────────────────────────────
    btnTorch.addEventListener('click', async () => {
      if (!torchFeature) return;
      try {
        torchOn = !torchOn;
        await torchFeature.apply(torchOn);
        btnTorch.classList.toggle('on', torchOn);
        btnTorch.textContent = torchOn ? '💡' : '🔦';
      } catch(_) {
        errorsEl.textContent += '[torch] indisponible\n';
        torchOn = false; btnTorch.classList.remove('on');
      }
    });

    // ── Saisie manuelle ────────────────────────────────────────────────────────
    function submitManual() {
      const v = mInput.value.trim().replace(/\D/g, '');
      if (!v) return;
      if (timerStart == null) timerStart = Date.now();
      recordScan(v, 'MANUAL');
      mInput.value = ''; mInput.blur();
    }
    mOk.addEventListener('click', submitManual);
    mInput.addEventListener('keydown', e => { if (e.key === 'Enter') submitManual(); });
  </script>
</body>
</html>

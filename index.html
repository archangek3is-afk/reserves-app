<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="app-version" content="1.0.0">
  <meta name="theme-color" content="#16263A">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="description" content="Gérez vos courses, votre kit de survie et votre budget en duo.">
  <title>Réserves & Courses</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png">
  <link rel="apple-touch-icon" href="./icons/icon-192.png">
  <link rel="stylesheet" href="./css/app.css">
</head>
<body>

  <!-- Update Banner -->
  <div class="update-banner" id="update-banner">
    <span>Nouvelle version disponible</span>
    <button class="btn btn--sm" id="btn-update" style="background:#fff;color:var(--accent);font-weight:700;">Mettre à jour</button>
  </div>

  <!-- Header -->
  <header class="app-header">
    <div style="display:flex;align-items:center;gap:10px;">
      <button class="btn-icon hidden" id="btn-back-from-settings" aria-label="Retour">←</button>
      <h1 class="app-header__title">Réserves</h1>
    </div>
    <div class="app-header__right">
      <span class="sync-pill" id="sync-pill">Chargement...</span>
      <button class="btn-icon" id="btn-settings" aria-label="Réglages">⚙️</button>
    </div>
  </header>

  <!-- Foyer Setup Overlay (hidden by default) -->
  <div id="foyer-container" class="hidden"></div>

  <!-- Main Content -->
  <main id="screen-container">
    <div class="spinner"></div>
  </main>

  <!-- Bottom Tab Bar -->
  <nav class="tab-bar" aria-label="Navigation principale">
    <button class="tab-bar__item tab-bar__item--active" data-tab="accueil" aria-label="Accueil">
      <span class="tab-bar__icon">🏠</span>
      <span>Accueil</span>
    </button>
    <button class="tab-bar__item" data-tab="courses" aria-label="Courses">
      <span class="tab-bar__icon">🛒</span>
      <span>Courses</span>
    </button>
    <button class="tab-bar__item" data-tab="kit" aria-label="Kit">
      <span class="tab-bar__icon">📦</span>
      <span>Kit</span>
    </button>
    <button class="tab-bar__item" data-tab="guide" aria-label="Guide">
      <span class="tab-bar__icon">🤰</span>
      <span>Guide</span>
    </button>
    <button class="tab-bar__item" data-tab="budget" aria-label="Budget">
      <span class="tab-bar__icon">💰</span>
      <span>Budget</span>
    </button>
  </nav>

  <!-- App JS (ES module) -->
  <script type="module" src="./js/app.js"></script>

</body>
</html>
